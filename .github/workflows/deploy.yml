name: Build & Deploy GestureMouse AI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    name: Build Windows Release Binary
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path dist/GestureMouseAI/* -DestinationPath GestureMouseAI-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureMouseAI-Windows-x64
          path: GestureMouseAI-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: GestureMouseAI-Windows-x64.zip
          name: GestureMouse AI ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
